<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="900" viewBox="0 0 1900 900">
  <defs>
    <marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L10,3 z" fill="#3478b9"/></marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L10,3 z" fill="#c9342f"/></marker>
    <marker id="black" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L10,3 z" fill="#222"/></marker>
    <style>
      .title{font:700 36px Arial,sans-serif;fill:#111}
      .section{font:700 25px Arial,sans-serif;fill:#111}
      .head{font:700 22px Arial,sans-serif;fill:#111}
      .label{font:18px Arial,sans-serif;fill:#222}
      .small{font:15px Arial,sans-serif;fill:#333}
      .box{fill:#fff;stroke:#555;stroke-width:2}
      .module{fill:#eef7ef;stroke:#2c7a45;stroke-width:2}
      .offline{fill:#f9eeee;stroke:#c9342f;stroke-width:2}
      .stat{fill:#f3f3f3;stroke:#777;stroke-width:2;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1900" height="900" fill="white"/>
  <text x="950" y="48" text-anchor="middle" class="title">Fig. 2  Logic draft of the FedDR framework</text>

  <text x="70" y="100" class="section">I. Offline federated initialization</text>
  <line x1="70" y1="118" x2="1830" y2="118" stroke="#222" stroke-width="2"/>
  <rect x="80" y="155" width="265" height="145" rx="15" class="offline"/>
  <text x="212" y="190" text-anchor="middle" class="head">Federated clients</text>
  <circle cx="145" cy="240" r="14" fill="#c9342f"/><circle cx="205" cy="220" r="14" fill="#c9342f"/><circle cx="265" cy="250" r="14" fill="#c9342f"/>
  <text x="212" y="280" text-anchor="middle" class="small">non-IID source data</text>

  <line x1="345" y1="228" x2="445" y2="228" stroke="#c9342f" stroke-width="5" marker-end="url(#red)"/>
  <rect x="455" y="155" width="300" height="145" rx="15" class="offline"/>
  <text x="605" y="190" text-anchor="middle" class="head">FedACG federated training</text>
  <text x="605" y="235" text-anchor="middle" class="label">server aggregation</text>
  <text x="605" y="270" text-anchor="middle" class="small">upstream initialization only</text>

  <line x1="755" y1="228" x2="855" y2="228" stroke="#c9342f" stroke-width="5" marker-end="url(#red)"/>
  <rect x="865" y="155" width="315" height="145" rx="15" class="box"/>
  <text x="1022" y="190" text-anchor="middle" class="head">Deployment anchor</text>
  <text x="1022" y="235" text-anchor="middle" class="label">checkpoint θ₀</text>
  <text x="1022" y="270" text-anchor="middle" class="label">lookahead_anchor</text>

  <line x1="1180" y1="228" x2="1280" y2="228" stroke="#777" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#black)"/>
  <rect x="1290" y="155" width="250" height="145" rx="15" class="stat"/>
  <text x="1415" y="190" text-anchor="middle" class="head">Offline statistics</text>
  <text x="1415" y="235" text-anchor="middle" class="label">feature statistics</text>
  <text x="1415" y="270" text-anchor="middle" class="label">Fisher statistics</text>
  <text x="1600" y="235" class="small">No raw source data online</text>

  <line x1="70" y1="350" x2="1830" y2="350" stroke="#999" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="70" y="395" class="section">II. Online continual test-time adaptation</text>

  <rect x="70" y="470" width="195" height="150" rx="15" class="box"/>
  <text x="167" y="510" text-anchor="middle" class="head">Target batch</text>
  <text x="167" y="565" text-anchor="middle" class="label">Bₜ</text>
  <text x="167" y="595" text-anchor="middle" class="small">unlabeled stream</text>

  <line x1="265" y1="545" x2="330" y2="545" stroke="#3478b9" stroke-width="5" marker-end="url(#blue)"/>
  <rect x="340" y="470" width="235" height="150" rx="15" class="box"/>
  <text x="457" y="510" text-anchor="middle" class="head">Predict first</text>
  <text x="457" y="545" text-anchor="middle" class="label">test-time model θₜ</text>
  <text x="457" y="580" text-anchor="middle" class="label">fθₜ(Bₜ)</text>
  <text x="457" y="610" text-anchor="middle" class="small">pre-update prediction</text>

  <line x1="575" y1="545" x2="640" y2="545" stroke="#3478b9" stroke-width="5" marker-end="url(#blue)"/>
  <rect x="650" y="440" width="330" height="210" rx="15" class="module"/>
  <text x="815" y="480" text-anchor="middle" class="head">DLRS</text>
  <text x="815" y="520" text-anchor="middle" class="label">Entropy + PLPD + margin</text>
  <text x="815" y="560" text-anchor="middle" class="label">→ sample reliability rᵢ</text>
  <text x="815" y="600" text-anchor="middle" class="label">→ region scale + joint weight</text>
  <text x="815" y="630" text-anchor="middle" class="small">all samples softly weighted</text>

  <line x1="980" y1="545" x2="1045" y2="545" stroke="#3478b9" stroke-width="5" marker-end="url(#blue)"/>
  <rect x="1055" y="470" width="245" height="150" rx="15" class="module"/>
  <text x="1177" y="510" text-anchor="middle" class="head">BN-affine update</text>
  <text x="1177" y="555" text-anchor="middle" class="label">reliability-aware</text>
  <text x="1177" y="590" text-anchor="middle" class="small">running stats frozen</text>

  <line x1="1300" y1="545" x2="1365" y2="545" stroke="#3478b9" stroke-width="5" marker-end="url(#blue)"/>
  <rect x="1375" y="440" width="325" height="210" rx="15" class="module"/>
  <text x="1537" y="480" text-anchor="middle" class="head">FSLR  (periodic)</text>
  <text x="1537" y="520" text-anchor="middle" class="label">Fisher × |parameter drift|</text>
  <text x="1537" y="560" text-anchor="middle" class="label">→ drift-tiered sparse selection</text>
  <text x="1537" y="600" text-anchor="middle" class="label">→ partial restore toward θ₀</text>
  <text x="1537" y="630" text-anchor="middle" class="small">every K batches</text>

  <line x1="1700" y1="545" x2="1765" y2="545" stroke="#3478b9" stroke-width="5" marker-end="url(#blue)"/>
  <rect x="1775" y="470" width="100" height="150" rx="15" class="box"/>
  <text x="1825" y="510" text-anchor="middle" class="head">θₜ₊₁</text>
  <text x="1825" y="555" text-anchor="middle" class="small">adapted</text>
  <text x="1825" y="585" text-anchor="middle" class="small">state</text>

  <!-- control/statistics arrows -->
  <path d="M1022,300 C1022,350 457,350 457,470" fill="none" stroke="#c9342f" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#red)"/>
  <text x="650" y="365" class="small" fill="#c9342f">initialize test-time model θₜ</text>
  <path d="M1022,300 C1150,360 1537,340 1537,440" fill="none" stroke="#c9342f" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#red)"/>
  <text x="1280" y="365" class="small" fill="#c9342f">anchor reference θ₀</text>
  <path d="M1415,300 C1415,350 815,350 815,440" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#black)"/>
  <text x="1080" y="330" class="small">feature statistics</text>
  <path d="M1450,300 C1550,350 1537,370 1537,440" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#black)"/>
  <text x="1580" y="330" class="small">Fisher statistics</text>
  <path d="M815,650 C1050,710 1380,710 1537,650" fill="none" stroke="#2c7a45" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#black)"/>
  <text x="1050" y="735" class="small" fill="#2c7a45">current-batch reliability authorizes / scales FSLR</text>
  <path d="M1825,620 C1825,780 170,780 167,620" fill="none" stroke="#3478b9" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#blue)"/>
  <text x="770" y="820" class="label" fill="#3478b9">continual state loop: θₜ₊₁ → next target batch</text>

  <text x="70" y="875" class="small">Solid blue: target-data flow   |   dashed red: anchor control   |   dashed gray: offline statistics   |   dashed blue: continual state loop</text>
</svg>
