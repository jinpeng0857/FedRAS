<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="72mm" viewBox="0 0 1800 720">
  <title>FedDR framework: short- and long-term reliability control</title>
  <desc>Three-stage horizontal framework showing federated initialization, continual test-time adaptation, and lightweight clean/revisit evaluation.</desc>
  <defs>
    <style>
      .txt{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:28px;font-weight:700}.stage{font-size:19px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.math{font-family:"Times New Roman",serif;font-size:22px;font-style:italic;fill:#111}
      .box{fill:#fff;stroke:#111;stroke-width:3}.module{fill:#fff;stroke:#111;stroke-width:3;stroke-dasharray:11 8}.soft{fill:#f7f7f7;stroke:#111;stroke-width:3}
      .black{fill:none;stroke:#111;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.red{fill:none;stroke:#d73027;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.blue{fill:none;stroke:#2c7fb8;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}.grad{fill:none;stroke:#111;stroke-width:2.7;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="aBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d73027"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2c7fb8"/></marker>
  </defs>
  <path d="M0 0H1800V720H0Z" fill="#fff"/>

  <text x="900" y="34" text-anchor="middle" class="txt title">FedDR: short- and long-term reliability control</text>
  <text x="42" y="76" class="txt stage">I  Federated initialization</text>
  <text x="515" y="76" class="txt stage">II  Continual test-time adaptation</text>
  <text x="1580" y="76" class="txt stage">III  Evaluation</text>
  <path d="M42 88H470M515 88H1530M1580 88H1760" stroke="#111" stroke-width="2"/>

  <!-- Stage I -->
  <text x="47" y="125" class="txt head">Federated Source Data</text>
  <circle cx="75" cy="169" r="14" fill="#d73027"/><circle cx="111" cy="145" r="14" fill="#d73027"/><circle cx="146" cy="180" r="14" fill="#d73027"/><path d="M186 143L202 173L170 173Z" fill="#d73027"/><path d="M232 176L248 206L216 206Z" fill="#d73027"/>
  <path d="M278 169L333 169" class="red" marker-end="url(#aRed)"/>
  <text x="354" y="140" text-anchor="middle" class="txt head">Federated</text>
  <text x="354" y="168" text-anchor="middle" class="txt head">Pre-training</text>
  <path d="M354 189L354 223" class="red" marker-end="url(#aRed)"/>
  <text x="354" y="260" text-anchor="middle" class="txt head">Anchor Model</text>
  <text x="354" y="289" text-anchor="middle" class="math">θ₀</text>

  <!-- Anchor reference to FSLR -->
  <path d="M430 270H1280V302" class="red" stroke-dasharray="10 8" marker-end="url(#aRed)"/>
  <text x="855" y="261" text-anchor="middle" class="txt small" fill="#d73027">anchor reference</text>

  <!-- Target stream and compact model -->
  <path d="M42 334H470" stroke="#111" stroke-width="2"/>
  <text x="42" y="324" class="txt stage">Continual target stream</text>
  <rect x="42" y="354" width="382" height="124" rx="18" class="box"/>
  <text x="66" y="388" class="txt head">Client Test Stream</text>
  <text x="80" y="434" class="math">B₁</text><path d="M121 428L166 428" class="blue" marker-end="url(#aBlue)"/><text x="185" y="434" class="math">B₂</text><path d="M229 428L274 428" class="blue" marker-end="url(#aBlue)"/><text x="294" y="434" class="txt body">···</text><path d="M332 428L377 428" class="blue" marker-end="url(#aBlue)"/><text x="391" y="434" class="math">Bₜ₊₁</text>
  <path d="M385 453C411 465 410 399 380 405" class="blue" marker-end="url(#aBlue)"/>
  <text x="233" y="462" text-anchor="middle" class="txt small">next target batch</text>

  <rect x="507" y="354" width="245" height="124" rx="18" class="soft"/>
  <text x="629" y="390" text-anchor="middle" class="txt head">Test-time Model</text>
  <text x="629" y="425" text-anchor="middle" class="txt body">Feature Extractor → Predict</text>
  <text x="629" y="456" text-anchor="middle" class="math">ŷₜ</text>
  <path d="M424 416L507 416" class="blue" marker-end="url(#aBlue)"/>
  <path d="M354 289C420 305 487 338 558 354" class="red" marker-end="url(#aRed)"/>
  <text x="451" y="309" text-anchor="middle" class="txt small" fill="#d73027">initialize θₜ</text>

  <!-- Main adaptation line -->
  <rect x="820" y="354" width="216" height="124" rx="18" class="module"/>
  <text x="928" y="395" text-anchor="middle" class="txt head">DLRS</text>
  <text x="928" y="428" text-anchor="middle" class="txt body">Short-term reliability</text>
  <text x="928" y="458" text-anchor="middle" class="txt small">sample weighting</text>
  <path d="M752 416L820 416" class="blue" marker-end="url(#aBlue)"/>

  <rect x="1084" y="354" width="216" height="124" rx="18" class="module"/>
  <text x="1192" y="395" text-anchor="middle" class="txt head">Model Update</text>
  <text x="1192" y="428" text-anchor="middle" class="txt body">reliable adaptation</text>
  <text x="1192" y="458" text-anchor="middle" class="math">θₜ → θₜ₊₁</text>
  <path d="M1036 416L1084 416" class="blue" marker-end="url(#aBlue)"/>
  <path d="M928 478C962 527 1110 527 1192 478" class="grad" marker-end="url(#aBlack)"/>
  <text x="1060" y="548" text-anchor="middle" class="txt small">gradient update</text>

  <rect x="1345" y="354" width="216" height="124" rx="18" class="module"/>
  <text x="1453" y="395" text-anchor="middle" class="txt head">FSLR</text>
  <text x="1453" y="428" text-anchor="middle" class="txt body">Long-term drift control</text>
  <text x="1453" y="458" text-anchor="middle" class="txt small">sparse restoration</text>
  <path d="M1300 416L1345 416" class="blue" marker-end="url(#aBlue)"/>
  <path d="M1561 416L1590 416" class="blue" marker-end="url(#aBlue)"/>
  <rect x="1590" y="354" width="180" height="124" rx="18" class="soft"/>
  <text x="1680" y="395" text-anchor="middle" class="txt head">Adapted Model</text>
  <text x="1680" y="428" text-anchor="middle" class="math">θₜ₊₁</text>
  <text x="1680" y="458" text-anchor="middle" class="txt small">stabilized state</text>

  <!-- Evaluation, deliberately secondary -->
  <rect x="1630" y="485" width="145" height="100" rx="16" class="soft"/>
  <text x="1702" y="521" text-anchor="middle" class="txt head">Evaluation</text>
  <text x="1702" y="550" text-anchor="middle" class="txt small">Clean / Revisit</text>
  <path d="M1702 416L1702 485" class="black" marker-end="url(#aBlack)"/>

  <!-- Unified legend -->
  <circle cx="386" cy="675" r="12" fill="#d73027"/><text x="409" y="681" class="txt small">source / anchor</text>
  <circle cx="622" cy="675" r="12" fill="#2c7fb8"/><text x="645" y="681" class="txt small">target stream</text>
  <path d="M858 675L918 675" class="grad" marker-end="url(#aBlack)"/><text x="939" y="681" class="txt small">gradient update</text>
  <path d="M1190 675L1250 675" class="blue" marker-end="url(#aBlue)"/><text x="1271" y="681" class="txt small">continual flow</text>
</svg>
