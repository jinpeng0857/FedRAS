<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="72mm" viewBox="0 0 1800 720">
  <title>FedDR motivation: domain gap, existing federated TTA limitations, and mutually reinforcing control</title>
  <desc>Three-panel flat scatter schematic. Red and blue samples show source and target domains; black dashed curves show decision boundaries. No algorithm boxes or internal parameters are used.</desc>
  <defs>
    <style>
      .txt{font-family:Arial,Helvetica,sans-serif;fill:#111}.panel{font-size:32px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:19px}.small{font-size:16px}.math{font-family:"Times New Roman",serif;font-size:23px;font-style:italic;fill:#111}
      .boundary{fill:none;stroke:#111;stroke-width:5;stroke-dasharray:18 13;stroke-linecap:round}.thinBoundary{fill:none;stroke:#111;stroke-width:3;stroke-dasharray:10 10;stroke-linecap:round}.black{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.red{fill:none;stroke:#d73027;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.blue{fill:none;stroke:#2c7fb8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrowBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d73027"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2c7fb8"/></marker>
    <marker id="arrowBlackBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#111"/></marker>
  </defs>

  <path d="M0 0H1800V720H0Z" fill="#fff"/>
  <path d="M600 42V590M1200 42V590" stroke="#111" stroke-width="2" stroke-dasharray="3 10"/>

  <!-- a: domain gap -->
  <text x="32" y="54" class="txt panel">a</text>
  <text x="300" y="54" text-anchor="middle" class="txt head">Domain gap at deployment</text>
  <circle cx="108" cy="147" r="17" fill="#d73027"/><circle cx="158" cy="112" r="17" fill="#d73027"/><circle cx="183" cy="176" r="17" fill="#d73027"/><circle cx="122" cy="215" r="17" fill="#d73027"/><circle cx="191" cy="239" r="17" fill="#d73027"/>
  <circle cx="379" cy="111" r="17" fill="#2c7fb8"/><circle cx="429" cy="87" r="17" fill="#2c7fb8"/><circle cx="471" cy="138" r="17" fill="#2c7fb8"/><circle cx="402" cy="176" r="17" fill="#2c7fb8"/><circle cx="463" cy="202" r="17" fill="#2c7fb8"/><circle cx="500" cy="104" r="17" fill="#2c7fb8"/>
  <path d="M118 378L138 416L98 416Z" fill="#2c7fb8"/><path d="M177 421L197 459L157 459Z" fill="#2c7fb8"/><path d="M237 385L257 423L217 423Z" fill="#2c7fb8"/><path d="M276 449L296 487L256 487Z" fill="#2c7fb8"/><path d="M153 479L173 517L133 517Z" fill="#2c7fb8"/>
  <path d="M410 369L430 407L390 407Z" fill="#d73027"/><path d="M468 341L488 379L448 379Z" fill="#d73027"/><path d="M511 401L531 439L491 439Z" fill="#d73027"/><path d="M445 447L465 485L425 485Z" fill="#d73027"/><path d="M523 470L543 508L503 508Z" fill="#d73027"/>
  <path d="M70 330C180 370 314 336 391 266C453 210 489 142 507 75" class="boundary"/>
  <path d="M225 168L344 139" class="black" marker-start="url(#arrowBlackBack)" marker-end="url(#arrowBlack)"/>
  <text x="284" y="127" text-anchor="middle" class="txt body">Domain gap</text>
  <path d="M372 231C414 254 466 251 512 224" class="blue" stroke-dasharray="8 8" marker-end="url(#arrowBlue)"/>
  <text x="447" y="274" text-anchor="middle" class="txt small">shifting target stream</text>
  <path d="M370 279L390 299M390 279L370 299" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <text x="399" y="317" class="math">θ₀</text>
  <text x="300" y="548" text-anchor="middle" class="txt body">Anchor boundary cannot cover target flow</text>

  <!-- b: limitations, two scatter regions -->
  <text x="626" y="54" class="txt panel">b</text>
  <text x="900" y="54" text-anchor="middle" class="txt head">Limitations of existing federated TTA</text>
  <path d="M635 315H1165" stroke="#111" stroke-width="2" stroke-dasharray="3 10"/>

  <text x="656" y="91" class="txt body">Equal-weight update</text>
  <circle cx="707" cy="150" r="17" fill="#2c7fb8"/><circle cx="751" cy="115" r="17" fill="#2c7fb8"/><circle cx="792" cy="172" r="17" fill="#2c7fb8"/>
  <path d="M708 252L728 290L688 290Z" fill="#2c7fb8"/><path d="M765 227L785 265L745 265Z" fill="#2c7fb8"/>
  <circle cx="866" cy="151" r="17" fill="#111"/><path d="M904 214L924 252L884 252Z" fill="#111"/><circle cx="950" cy="203" r="17" fill="#111"/>
  <circle cx="1050" cy="118" r="17" fill="#2c7fb8"/><circle cx="1096" cy="157" r="17" fill="#2c7fb8"/><path d="M1055 247L1075 285L1035 285Z" fill="#2c7fb8"/><path d="M1110 225L1130 263L1090 263Z" fill="#2c7fb8"/>
  <path d="M824 88C842 144 845 214 823 290" class="boundary"/>
  <path d="M866 151C893 153 924 169 948 187" class="black" marker-end="url(#arrowBlack)"/><path d="M905 227C925 219 944 211 959 207" class="black" marker-end="url(#arrowBlack)"/>
  <text x="1011" y="192" class="txt body">noise dominates update</text>
  <text x="900" y="296" text-anchor="middle" class="txt small">all target samples receive the same influence</text>

  <text x="656" y="351" class="txt body">Uncontrolled long-stream drift</text>
  <circle cx="708" cy="422" r="17" fill="#2c7fb8"/><circle cx="759" cy="391" r="17" fill="#2c7fb8"/><circle cx="777" cy="449" r="17" fill="#2c7fb8"/>
  <path d="M1023 432L1043 470L1003 470Z" fill="#2c7fb8"/><path d="M1073 390L1093 428L1053 428Z" fill="#2c7fb8"/><path d="M1110 455L1130 493L1090 493Z" fill="#2c7fb8"/>
  <path d="M838 363C857 423 856 501 833 564" class="thinBoundary"/>
  <path d="M913 359C936 425 940 503 925 567" class="boundary"/>
  <path d="M837 458L837 487" stroke="#111" stroke-width="5" stroke-linecap="round"/><path d="M826 469L848 491M848 469L826 491" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <text x="810" y="520" class="math">θ₀</text>
  <circle cx="929" cy="472" r="12" fill="#111"/>
  <text x="943" y="520" class="txt small">drifted boundary</text>
  <path d="M857 474L911 474" class="black" marker-end="url(#arrowBlack)"/>
  <text x="885" y="456" text-anchor="middle" class="txt small">drift</text>
  <path d="M771 533C744 506 744 474 758 447" class="black" marker-end="url(#arrowBlack)"/>
  <text x="677" y="549" class="txt small">long test stream</text>
  <text x="1015" y="548" class="txt body">performance decay</text>
  <text x="900" y="587" text-anchor="middle" class="txt small">the boundary moves away from the anchor</text>

  <!-- c: FedDR effect-only control -->
  <text x="1226" y="54" class="txt panel">c</text>
  <text x="1500" y="54" text-anchor="middle" class="txt head">FedDR: mutually reinforcing control</text>
  <circle cx="1315" cy="154" r="17" fill="#2c7fb8"/><circle cx="1364" cy="128" r="17" fill="#2c7fb8"/><circle cx="1413" cy="170" r="17" fill="#2c7fb8"/>
  <path d="M1325 244L1345 282L1305 282Z" fill="#2c7fb8"/><path d="M1383 223L1403 261L1363 261Z" fill="#2c7fb8"/>
  <circle cx="1491" cy="160" r="17" fill="#111"/><path d="M1535 228L1555 266L1515 266Z" fill="#111"/>
  <circle cx="1636" cy="140" r="17" fill="#2c7fb8"/><path d="M1642 229L1662 267L1622 267Z" fill="#2c7fb8"/>
  <path d="M1440 87C1454 140 1455 215 1440 282" class="boundary"/>
  <path d="M1491 160C1525 159 1556 149 1582 132" class="black" marker-end="url(#arrowBlack)"/>
  <text x="1546" y="112" text-anchor="middle" class="txt body">DLRS reduces noise influence</text>
  <path d="M1600 310C1546 327 1488 330 1435 316" class="black" marker-end="url(#arrowBlack)"/>
  <text x="1517" y="349" text-anchor="middle" class="txt body">FSLR restores the boundary toward θ₀</text>
  <path d="M1370 408L1628 408" class="black" marker-start="url(#arrowBlackBack)" marker-end="url(#arrowBlack)"/>
  <text x="1500" y="392" text-anchor="middle" class="txt body">positive feedback loop</text>
  <path d="M1415 282C1475 305 1554 304 1618 274" class="blue" marker-end="url(#arrowBlue)"/>
  <path d="M1618 274C1553 305 1476 306 1415 282" class="red" marker-end="url(#arrowRed)"/>
  <text x="1500" y="471" text-anchor="middle" class="txt body">less noise → less drift → stable adaptation</text>

  <!-- minimal shared legend: no surrounding rectangle -->
  <circle cx="155" cy="664" r="14" fill="#d73027"/><path d="M203 649L219 679L187 679Z" fill="#d73027"/><text x="241" y="671" class="txt small">source</text>
  <circle cx="374" cy="664" r="14" fill="#2c7fb8"/><path d="M422 649L438 679L406 679Z" fill="#2c7fb8"/><text x="460" y="671" class="txt small">target</text>
  <circle cx="591" cy="664" r="14" fill="#111"/><path d="M639 649L655 679L623 679Z" fill="#111"/><text x="677" y="671" class="txt small">noise</text>
  <path d="M770 664L841 664" class="boundary"/><text x="861" y="671" class="txt small">decision boundary</text>
  <path d="M1082 664L1153 664" class="black" marker-start="url(#arrowBlackBack)" marker-end="url(#arrowBlack)"/><text x="1174" y="671" class="txt small">feedback</text>
</svg>
