<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3478b9"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c9342f"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2c7a45"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#111}
      .panelTitle{font:700 25px Arial,sans-serif;fill:#111}
      .label{font:19px Arial,sans-serif;fill:#222}
      .small{font:16px Arial,sans-serif;fill:#333}
      .source{fill:#d8342f}
      .target{fill:#3478b9}
      .noise{fill:#222}
      .panel{fill:#fff;stroke:#777;stroke-width:2}
    </style>
  </defs>
  <rect width="1800" height="820" fill="white"/>
  <text x="900" y="48" text-anchor="middle" class="title">Fig. 1  Motivation of FedDR</text>

  <!-- panel a -->
  <rect x="25" y="78" width="555" height="590" rx="18" class="panel"/>
  <text x="52" y="120" class="panelTitle">(a) Domain gap at deployment</text>
  <text x="52" y="154" class="small">Federated anchor meets a shifting target stream</text>
  <line x1="65" y1="210" x2="520" y2="210" stroke="#3478b9" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="65" y="194" class="small">continual target stream</text>
  <g class="source">
    <circle cx="145" cy="345" r="14"/><circle cx="190" cy="300" r="14"/><circle cx="205" cy="380" r="14"/>
    <circle cx="250" cy="330" r="14"/><circle cx="160" cy="425" r="14"/><circle cx="270" cy="430" r="14"/>
  </g>
  <g class="target">
    <circle cx="385" cy="285" r="14"/><circle cx="430" cy="335" r="14"/><circle cx="475" cy="280" r="14"/>
    <circle cx="400" cy="405" r="14"/><circle cx="455" cy="445" r="14"/><circle cx="510" cy="380" r="14"/>
  </g>
  <path d="M320,250 C300,315 300,385 320,475" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="100" y="520" class="label" fill="#d8342f">source / anchor</text>
  <text x="375" y="520" class="label" fill="#3478b9">target stream</text>
  <text x="96" y="580" class="small">θ₀ cannot fully cover the target flow</text>

  <!-- panel b -->
  <rect x="615" y="78" width="555" height="590" rx="18" class="panel"/>
  <text x="642" y="120" class="panelTitle">(b) Uncontrolled continual TTA</text>
  <text x="642" y="154" class="small">Two failure modes accumulate over time</text>
  <text x="650" y="215" class="label">Equal-weight update</text>
  <circle cx="700" cy="285" r="15" class="target"/><circle cx="755" cy="320" r="15" class="target"/>
  <circle cx="815" cy="270" r="15" class="noise"/><circle cx="860" cy="345" r="15" class="target"/>
  <path d="M690,390 C750,365 815,405 875,380" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="9 8"/>
  <path d="M705,260 L815,270" stroke="#c9342f" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="650" y="430" class="small">noise-dominated update</text>
  <text x="650" y="500" class="label">Long-stream drift</text>
  <path d="M690,565 C770,520 855,575 970,510" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="9 8"/>
  <path d="M685,565 C800,555 895,590 1040,570" fill="none" stroke="#c9342f" stroke-width="3"/>
  <path d="M900,550 L1035,570" stroke="#c9342f" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="650" y="615" class="small">decision boundary moves away from θ₀</text>

  <!-- panel c -->
  <rect x="1205" y="78" width="570" height="590" rx="18" class="panel"/>
  <text x="1232" y="120" class="panelTitle">(c) FedDR: coupled control</text>
  <text x="1232" y="154" class="small">Short-term reliability + long-term stability</text>
  <text x="1245" y="215" class="label" fill="#2c7a45">DLRS: reliability-aware soft weighting</text>
  <g>
    <circle cx="1280" cy="290" r="13" fill="#e9b44c"/><circle cx="1330" cy="320" r="13" fill="#8fc35a"/>
    <circle cx="1380" cy="275" r="13" fill="#2c7a45"/><circle cx="1430" cy="350" r="13" fill="#d99b45"/>
  </g>
  <path d="M1265,390 C1330,360 1400,395 1460,375" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="9 8"/>
  <path d="M1280,290 C1320,315 1370,330 1430,350" fill="none" stroke="#2c7a45" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="1245" y="430" class="small">less influence from unreliable samples</text>
  <text x="1245" y="500" class="label" fill="#2c7a45">FSLR: Fisher–drift sparse restoration</text>
  <path d="M1265,565 C1345,520 1420,575 1510,525" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="9 8"/>
  <path d="M1510,525 C1450,490 1370,500 1305,540" fill="none" stroke="#2c7a45" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="1245" y="615" class="small">periodically returns high-risk drift toward θ₀</text>

  <line x1="80" y1="735" x2="140" y2="735" stroke="#3478b9" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="155" y="742" class="small">target flow</text>
  <circle cx="330" cy="735" r="10" fill="#d8342f"/><text x="350" y="742" class="small">source / anchor</text>
  <circle cx="550" cy="735" r="10" fill="#222"/><text x="570" y="742" class="small">noise</text>
  <line x1="740" y1="735" x2="800" y2="735" stroke="#2c7a45" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="815" y="742" class="small">stabilization</text>
</svg>
