<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="82mm" viewBox="0 0 1800 820">
  <title>Overall framework of FedDR for federated continual test-time adaptation</title>
  <desc>Conceptual left-to-right data flow showing federated anchor initialization, target test stream, prediction, DLRS soft reliability adaptation, periodic FSLR restoration, iteration, and frozen post-stream evaluation.</desc>
  <defs>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-size:28px;font-weight:700}.m{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px}.xs{font-size:14px}
      .math{font-family:"Times New Roman",serif;font-size:22px;font-style:italic;fill:#111}
      .box{fill:#fff;stroke:#111;stroke-width:3}.soft{fill:#f7f7f7;stroke:#111;stroke-width:3}.module{fill:#fff;stroke:#111;stroke-width:3;stroke-dasharray:12 8}
      .black{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.red{fill:none;stroke:#d73027;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.blue{fill:none;stroke:#2c7fb8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .grad{fill:none;stroke:#111;stroke-width:3;stroke-dasharray:8 7;stroke-linecap:round}.thin{fill:none;stroke:#111;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#111"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d73027"/></marker>
    <marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2c7fb8"/></marker>
    <marker id="abr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#111"/></marker>
    <marker id="aur" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#2c7fb8"/></marker>
  </defs>
  <rect width="1800" height="820" fill="#fff"/>

  <text x="900" y="42" text-anchor="middle" class="t h">FedDR: federated continual test-time adaptation</text>

  <!-- left inputs -->
  <rect x="38" y="88" width="270" height="174" rx="18" class="module"/>
  <text x="173" y="119" text-anchor="middle" class="t m">Federated pre-training</text>
  <rect x="68" y="140" width="92" height="54" rx="10" class="soft"/>
  <rect x="186" y="140" width="92" height="54" rx="10" class="soft"/>
  <text x="114" y="173" text-anchor="middle" class="t b">Client 1</text>
  <text x="232" y="173" text-anchor="middle" class="t b">Client K</text>
  <path d="M115 206 C145 238,202 238,232 206" class="red" marker-end="url(#ar)"/>
  <text x="173" y="249" text-anchor="middle" class="t s" fill="#d73027">source-domain aggregation</text>

  <rect x="69" y="302" width="208" height="92" rx="16" class="box"/>
  <text x="173" y="336" text-anchor="middle" class="t m">Deployment anchor</text>
  <text x="173" y="373" text-anchor="middle" class="math">θ₀  +  Fisher statistics</text>
  <path d="M173 262 L173 302" class="red" marker-end="url(#ar)"/>
  <path d="M277 324 L330 324 L330 72 L1446 72 L1446 189" class="red" stroke-dasharray="12 9" marker-end="url(#ar)"/>
  <text x="1195" y="66" text-anchor="middle" class="t s" fill="#d73027">offline anchor θ₀ + Fisher statistics</text>

  <rect x="38" y="491" width="270" height="150" rx="18" class="module"/>
  <text x="173" y="526" text-anchor="middle" class="t m">Client test stream</text>
  <rect x="70" y="552" width="64" height="49" rx="9" class="soft"/><rect x="143" y="552" width="64" height="49" rx="9" class="soft"/><rect x="216" y="552" width="64" height="49" rx="9" class="soft"/>
  <text x="102" y="583" text-anchor="middle" class="math">Bₜ</text><text x="175" y="583" text-anchor="middle" class="math">Bₜ₊₁</text><text x="248" y="583" text-anchor="middle" class="t b">···</text>
  <text x="173" y="626" text-anchor="middle" class="t s" fill="#2c7fb8">unlabeled shifted batches</text>

  <!-- unified model -->
  <rect x="365" y="184" width="172" height="382" rx="18" class="soft"/>
  <text x="451" y="221" text-anchor="middle" class="t m">Current model</text>
  <text x="451" y="250" text-anchor="middle" class="math">fθₜ</text>
  <rect x="394" y="285" width="114" height="107" rx="13" class="box"/>
  <text x="451" y="326" text-anchor="middle" class="t b">Feature</text>
  <text x="451" y="354" text-anchor="middle" class="t b">extractor</text>
  <text x="451" y="380" text-anchor="middle" class="t s">frozen</text>
  <rect x="394" y="424" width="114" height="103" rx="13" class="box"/>
  <text x="451" y="461" text-anchor="middle" class="t b">BN affine</text>
  <text x="451" y="490" text-anchor="middle" class="math">γₜ, βₜ</text>
  <text x="451" y="516" text-anchor="middle" class="t s">trainable</text>
  <path d="M308 348 L365 348" class="red" marker-end="url(#ar)"/>
  <path d="M308 568 C332 568,339 526,365 526" class="blue" marker-end="url(#au)"/>
  <text x="334" y="546" text-anchor="middle" class="t s" fill="#2c7fb8">Bₜ</text>

  <!-- prediction branch -->
  <rect x="592" y="111" width="219" height="98" rx="20" class="box"/>
  <text x="701" y="148" text-anchor="middle" class="t m">Predict</text>
  <text x="701" y="180" text-anchor="middle" class="math">ŷₜ = fθₜ(Bₜ)</text>
  <path d="M537 296 C565 296,566 160,592 160" class="blue" marker-end="url(#au)"/>
  <text x="559" y="234" class="t s" fill="#2c7fb8">pre-update</text>

  <!-- DLRS module -->
  <rect x="578" y="247" width="533" height="257" rx="24" class="module"/>
  <text x="604" y="280" class="t m">DLRS</text>
  <text x="700" y="280" class="t b">dual-level reliability soft adaptation</text>
  <rect x="608" y="308" width="142" height="76" rx="14" class="box"/>
  <text x="679" y="338" text-anchor="middle" class="t b">Reliability</text>
  <text x="679" y="368" text-anchor="middle" class="math">rᵢ</text>
  <rect x="785" y="308" width="142" height="76" rx="14" class="box"/>
  <text x="856" y="338" text-anchor="middle" class="t b">Region scale</text>
  <text x="856" y="368" text-anchor="middle" class="math">τᵢ(rᵢ)</text>
  <rect x="962" y="308" width="119" height="76" rx="14" class="box"/>
  <text x="1021" y="338" text-anchor="middle" class="t b">Joint weight</text>
  <text x="1021" y="368" text-anchor="middle" class="math">wᵢ</text>
  <path d="M750 346 L785 346" class="blue" marker-end="url(#au)"/><path d="M927 346 L962 346" class="blue" marker-end="url(#au)"/>
  <rect x="716" y="414" width="254" height="61" rx="14" class="soft"/>
  <text x="843" y="440" text-anchor="middle" class="t b">Regional weighted loss</text>
  <text x="843" y="466" text-anchor="middle" class="math">L = Σᵢ wᵢ(REᵢ + λRIᵢ)</text>
  <path d="M1021 384 C1021 415,982 444,970 444" class="black" marker-end="url(#ab)"/>
  <path d="M701 209 C701 226,679 234,679 308" class="blue" marker-end="url(#au)"/>
  <text x="630" y="230" class="t s" fill="#2c7fb8">logits / confidence</text>
  <path d="M716 445 C642 445,610 476,537 476" class="grad" marker-end="url(#ab)"/>
  <text x="625" y="429" text-anchor="middle" class="t s">∇θL</text>
  <text x="637" y="492" class="t xs">all samples softly weighted; update BN</text>

  <!-- periodic decision -->
  <path d="M1185 315 L1253 375 L1185 435 L1117 375 Z" class="box"/>
  <text x="1185" y="358" text-anchor="middle" class="t b">Every</text>
  <text x="1185" y="385" text-anchor="middle" class="t b">10 batches?</text>
  <text x="1185" y="411" text-anchor="middle" class="t s">t mod 10 = 0</text>
  <path d="M1111 375 L1117 375" class="black"/>

  <!-- FSLR -->
  <rect x="1279" y="189" width="335" height="370" rx="24" class="module"/>
  <text x="1305" y="224" class="t m">FSLR</text>
  <text x="1382" y="224" class="t b">periodic sparse restoration</text>
  <rect x="1310" y="255" width="273" height="64" rx="13" class="box"/>
  <text x="1446" y="281" text-anchor="middle" class="t b">Measure BN drift</text>
  <text x="1446" y="308" text-anchor="middle" class="math">dₜ = D(θₜ, θ₀)</text>
  <rect x="1310" y="346" width="273" height="64" rx="13" class="box"/>
  <text x="1446" y="372" text-anchor="middle" class="t b">Drift-tiered budget</text>
  <text x="1446" y="399" text-anchor="middle" class="t s">0% / 2% / 5% / 10%</text>
  <rect x="1310" y="437" width="273" height="64" rx="13" class="box"/>
  <text x="1446" y="463" text-anchor="middle" class="t b">Fisher × drift ranking</text>
  <text x="1446" y="490" text-anchor="middle" class="math">select BN coordinates</text>
  <path d="M1446 319 L1446 346" class="red" marker-end="url(#ar)"/><path d="M1446 410 L1446 437" class="red" marker-end="url(#ar)"/>
  <path d="M1253 375 L1279 375" class="red" marker-end="url(#ar)"/>
  <text x="1264" y="357" class="t s" fill="#d73027">yes</text>
  <path d="M1583 469 C1600 469,1603 526,1575 526" class="red"/>
  <text x="1446" y="535" text-anchor="middle" class="t b" fill="#d73027">soft restore toward θ₀</text>
  <text x="1446" y="557" text-anchor="middle" class="t s">θ ← (1−λ)θ + λθ₀</text>

  <!-- loops and evaluation -->
  <path d="M1185 435 C1185 648,728 668,537 534" class="blue" marker-end="url(#au)"/>
  <rect x="748" y="650" width="322" height="28" fill="#fff"/>
  <text x="907" y="671" text-anchor="middle" class="t s" fill="#2c7fb8">no: continue with next target batch Bₜ₊₁</text>
  <path d="M1279 526 C1136 625,780 623,537 509" class="red" marker-end="url(#ar)"/>
  <rect x="730" y="594" width="344" height="28" fill="#fff"/>
  <text x="902" y="615" text-anchor="middle" class="t s" fill="#d73027">restored BN state stabilizes subsequent predictions</text>
  <path d="M1051 530 C1111 576,1207 577,1270 526" class="thin" marker-start="url(#abr)" marker-end="url(#ab)"/>
  <rect x="1030" y="566" width="264" height="28" fill="#fff"/>
  <text x="1162" y="587" text-anchor="middle" class="t s">DLRS ↔ FSLR mutual reinforcement</text>

  <path d="M1614 374 L1663 374" class="black" marker-end="url(#ab)"/>
  <rect x="1664" y="290" width="111" height="169" rx="17" class="soft"/>
  <text x="1719" y="325" text-anchor="middle" class="t m">Frozen</text>
  <text x="1719" y="353" text-anchor="middle" class="t m">evaluation</text>
  <line x1="1683" y1="375" x2="1755" y2="375" stroke="#111" stroke-width="2"/>
  <text x="1719" y="405" text-anchor="middle" class="t b">Clean</text>
  <text x="1719" y="435" text-anchor="middle" class="t b">Revisit</text>
  <text x="1719" y="482" text-anchor="middle" class="t xs">after stream</text>

  <!-- legend -->
  <rect x="280" y="700" width="1240" height="78" class="box"/>
  <line x1="326" y1="739" x2="400" y2="739" class="red" marker-end="url(#ar)"/><text x="420" y="746" class="t b">federated source / anchor flow</text>
  <line x1="724" y1="739" x2="798" y2="739" class="blue" marker-end="url(#au)"/><text x="818" y="746" class="t b">target test data / iteration</text>
  <line x1="1085" y1="739" x2="1159" y2="739" class="grad" marker-end="url(#ab)"/><text x="1179" y="746" class="t b">gradient flow</text>
  <path d="M1375 717 L1401 739 L1375 761 L1349 739 Z" class="box"/><text x="1420" y="746" class="t b">decision</text>
</svg>
