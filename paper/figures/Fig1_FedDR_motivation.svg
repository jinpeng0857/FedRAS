<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="72mm" viewBox="0 0 1800 720">
  <title>FedDR motivation: domain gap, limitations of existing federated TTA, and DLRS-FSLR cooperation</title>
  <desc>Conceptual three-panel scientific schematic. Red denotes source samples, blue target samples, black unreliable target samples. Circles and triangles denote two classes.</desc>
  <defs>
    <style>
      .txt { font-family: Arial, Helvetica, sans-serif; fill: #111111; }
      .panel { font-size: 34px; font-weight: 700; }
      .head { font-size: 27px; font-weight: 700; }
      .sub { font-size: 22px; font-weight: 600; }
      .label { font-size: 20px; }
      .small { font-size: 17px; }
      .math { font-family: "Times New Roman", "STIX Two Text", serif; font-size: 24px; font-style: italic; fill: #111111; }
      .boundary { fill: none; stroke: #111111; stroke-width: 5; stroke-dasharray: 18 13; stroke-linecap: round; }
      .thin-boundary { fill: none; stroke: #111111; stroke-width: 3; stroke-dasharray: 9 9; stroke-linecap: round; }
      .guide { fill: none; stroke: #111111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .red-line { fill: none; stroke: #d73027; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .blue-line { fill: none; stroke: #2c7fb8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .divider { stroke: #111111; stroke-width: 2; stroke-dasharray: 3 10; }
    </style>
    <marker id="arrowBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d73027"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c7fb8"/>
    </marker>
    <g id="srcCircle"><circle r="17" fill="#d73027" stroke="#d73027" stroke-width="3"/></g>
    <g id="tgtCircle"><circle r="17" fill="#2c7fb8" stroke="#2c7fb8" stroke-width="3"/></g>
    <g id="noiseCircle"><circle r="17" fill="#111111" stroke="#111111" stroke-width="3"/></g>
    <g id="srcTri"><path d="M 0,-20 L 19,17 L -19,17 Z" fill="#d73027" stroke="#d73027" stroke-width="3"/></g>
    <g id="tgtTri"><path d="M 0,-20 L 19,17 L -19,17 Z" fill="#2c7fb8" stroke="#2c7fb8" stroke-width="3"/></g>
    <g id="noiseTri"><path d="M 0,-20 L 19,17 L -19,17 Z" fill="#111111" stroke="#111111" stroke-width="3"/></g>
    <g id="anchor"><path d="M -11,-11 L 11,11 M 11,-11 L -11,11" stroke="#111111" stroke-width="5" stroke-linecap="round"/></g>
  </defs>

  <rect x="0" y="0" width="1800" height="720" fill="#ffffff"/>
  <line x1="600" y1="42" x2="600" y2="590" stroke="#111111" stroke-width="2" stroke-dasharray="3 10"/>
  <line x1="1200" y1="42" x2="1200" y2="590" stroke="#111111" stroke-width="2" stroke-dasharray="3 10"/>

  <!-- Panel a: domain gap -->
  <text x="34" y="54" class="txt panel">a</text>
  <text x="300" y="55" text-anchor="middle" class="txt head">Domain gap at deployment</text>
  <use href="#srcCircle" x="112" y="154"/>
  <use href="#srcCircle" x="161" y="116"/>
  <use href="#srcCircle" x="187" y="181"/>
  <use href="#srcCircle" x="126" y="217"/>
  <use href="#srcCircle" x="195" y="244"/>
  <use href="#tgtCircle" x="378" y="117"/>
  <use href="#tgtCircle" x="430" y="91"/>
  <use href="#tgtCircle" x="473" y="145"/>
  <use href="#tgtCircle" x="401" y="177"/>
  <use href="#tgtCircle" x="463" y="205"/>
  <use href="#tgtCircle" x="499" y="107"/>
  <use href="#tgtTri" x="118" y="384"/>
  <use href="#tgtTri" x="175" y="426"/>
  <use href="#tgtTri" x="235" y="389"/>
  <use href="#tgtTri" x="276" y="453"/>
  <use href="#tgtTri" x="153" y="482"/>
  <use href="#srcTri" x="410" y="374"/>
  <use href="#srcTri" x="468" y="347"/>
  <use href="#srcTri" x="510" y="407"/>
  <use href="#srcTri" x="446" y="452"/>
  <use href="#srcTri" x="523" y="475"/>
  <path d="M 75 330 C 185 370, 315 335, 391 265 C 454 207, 488 141, 507 77" fill="none" stroke="#111111" stroke-width="5" stroke-dasharray="18 13" stroke-linecap="round"/>
  <use href="#anchor" x="377" y="282"/>
  <text x="391" y="303" class="math">θ₀</text>
  <line x1="223" y1="169" x2="346" y2="139" stroke="#111111" stroke-width="3" marker-start="url(#arrowBlack)" marker-end="url(#arrowBlack)"/>
  <text x="286" y="128" text-anchor="middle" class="txt label">Domain gap</text>
  <path d="M 372 232 C 414 255, 466 252, 512 224" fill="none" stroke="#2c7fb8" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrowBlue)"/>
  <text x="447" y="276" text-anchor="middle" class="txt small">shifting test stream</text>
  <text x="292" y="540" text-anchor="middle" class="txt sub">Anchor boundary misses target data</text>

  <!-- Panel b: two limitations -->
  <text x="625" y="54" class="txt panel">b</text>
  <text x="900" y="55" text-anchor="middle" class="txt head">Limitations of existing federated TTA</text>
  <line x1="635" y1="313" x2="1164" y2="313" stroke="#111111" stroke-width="2" stroke-dasharray="3 10"/>

  <text x="655" y="91" class="txt sub">Equal weighting</text>
  <text x="1128" y="91" text-anchor="end" class="math">wᵢ = 1</text>
  <use href="#tgtCircle" x="708" y="152"/>
  <use href="#tgtCircle" x="751" y="116"/>
  <use href="#tgtCircle" x="791" y="174"/>
  <use href="#tgtTri" x="708" y="256"/>
  <use href="#tgtTri" x="765" y="231"/>
  <use href="#noiseCircle" x="866" y="155"/>
  <use href="#noiseTri" x="903" y="231"/>
  <use href="#noiseCircle" x="951" y="207"/>
  <use href="#tgtCircle" x="1050" y="120"/>
  <use href="#tgtCircle" x="1095" y="160"/>
  <use href="#tgtTri" x="1054" y="251"/>
  <use href="#tgtTri" x="1110" y="230"/>
  <path d="M 824 88 C 841 144, 844 213, 823 290" fill="none" stroke="#111111" stroke-width="5" stroke-dasharray="18 13" stroke-linecap="round"/>
  <path d="M 879 153 C 899 155, 926 169, 945 186" fill="none" stroke="#d73027" stroke-width="4" marker-end="url(#arrowRed)"/>
  <path d="M 916 226 C 931 218, 944 213, 958 209" fill="none" stroke="#d73027" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="1011" y="194" class="txt label" fill="#d73027">noise interference</text>
  <text x="900" y="293" text-anchor="middle" class="txt small">Unreliable samples steer the update</text>

  <text x="655" y="350" class="txt sub">Uncontrolled BN drift</text>
  <use href="#tgtCircle" x="710" y="421"/>
  <use href="#tgtCircle" x="759" y="391"/>
  <use href="#tgtCircle" x="776" y="450"/>
  <use href="#tgtTri" x="1023" y="432"/>
  <use href="#tgtTri" x="1073" y="390"/>
  <use href="#tgtTri" x="1110" y="455"/>
  <path d="M 838 364 C 856 423, 855 501, 833 564" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="9 9" stroke-linecap="round"/>
  <path d="M 913 360 C 935 425, 939 502, 925 567" fill="none" stroke="#111111" stroke-width="5" stroke-dasharray="18 13" stroke-linecap="round"/>
  <use href="#anchor" x="838" y="472"/>
  <circle cx="929" cy="472" r="11" fill="#d73027"/>
  <text x="808" y="512" class="math">θ₀</text>
  <text x="942" y="512" class="math">θₜ</text>
  <line x1="854" y1="472" x2="914" y2="472" stroke="#d73027" stroke-width="4" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <text x="884" y="455" text-anchor="middle" class="math">dₜ</text>
  <path d="M 796 548 C 760 513, 754 476, 772 443" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#arrowBlack)"/>
  <text x="681" y="548" class="txt small">long stream</text>
  <path d="M 1000 526 L 1094 526" fill="none" stroke="#d73027" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="1047" y="506" text-anchor="middle" class="txt label" fill="#d73027">decay</text>
  <text x="900" y="586" text-anchor="middle" class="txt small">Boundary drifts away from the anchor</text>

  <!-- Panel c: FedDR cooperation -->
  <text x="1225" y="54" class="txt panel">c</text>
  <text x="1500" y="55" text-anchor="middle" class="txt head">FedDR: mutually reinforcing control</text>

  <rect x="1262" y="87" width="438" height="202" rx="12" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="1300" y="120" class="txt sub">DLRS</text>
  <text x="1390" y="120" class="txt label">soft reliability weighting</text>
  <use href="#tgtCircle" x="1315" y="171"/>
  <use href="#tgtCircle" x="1364" y="149"/>
  <use href="#tgtCircle" x="1412" y="183"/>
  <use href="#tgtTri" x="1324" y="246"/>
  <use href="#tgtTri" x="1383" y="229"/>
  <use href="#noiseCircle" x="1491" y="176"/>
  <use href="#noiseTri" x="1534" y="239"/>
  <use href="#tgtCircle" x="1635" y="155"/>
  <use href="#tgtTri" x="1640" y="236"/>
  <path d="M 1441 126 C 1454 173, 1454 231, 1440 269" fill="none" stroke="#111111" stroke-width="5" stroke-dasharray="18 13" stroke-linecap="round"/>
  <circle cx="1491" cy="176" r="28" fill="none" stroke="#d73027" stroke-width="3"/>
  <text x="1518" y="156" class="math">rᵢ↓</text>
  <path d="M 1559 205 C 1588 203, 1607 192, 1622 173" fill="none" stroke="#2c7fb8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="1584" y="132" text-anchor="middle" class="txt small">reliable update</text>
  <text x="1482" y="280" text-anchor="middle" class="txt small">All samples retained; noisy influence is reduced</text>

  <rect x="1262" y="383" width="438" height="180" rx="12" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="1300" y="420" class="txt sub">FSLR</text>
  <text x="1388" y="420" class="txt label">periodic layered restoration</text>
  <use href="#anchor" x="1390" y="490"/>
  <circle cx="1572" cy="490" r="12" fill="#d73027"/>
  <text x="1356" y="531" class="math">θ₀</text>
  <text x="1584" y="531" class="math">θₜ</text>
  <line x1="1412" y1="490" x2="1554" y2="490" stroke="#111111" stroke-width="3" marker-start="url(#arrowBlack)" marker-end="url(#arrowBlack)"/>
  <text x="1483" y="476" text-anchor="middle" class="math">dₜ</text>
  <path d="M 1569 449 C 1526 412, 1439 413, 1400 466" fill="none" stroke="#d73027" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="1483" y="445" text-anchor="middle" class="txt small" fill="#d73027">sparse restore</text>
  <text x="1482" y="552" text-anchor="middle" class="txt small">Drift-aware return toward the anchor</text>

  <path d="M 1722 210 C 1770 252, 1770 350, 1720 407" fill="none" stroke="#2c7fb8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="1762" y="313" text-anchor="middle" class="txt small" transform="rotate(90 1762 313)">cleaner updates</text>
  <path d="M 1230 438 C 1205 383, 1205 287, 1230 233" fill="none" stroke="#d73027" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="1248" y="335" text-anchor="middle" class="txt small" transform="rotate(-90 1248 335)">stable predictions</text>
  <text x="1482" y="592" text-anchor="middle" class="txt sub">DLRS ↔ FSLR positive loop</text>

  <!-- Unified legend -->
  <rect x="134" y="623" width="1532" height="65" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <use href="#srcCircle" x="191" y="655" transform="scale(.70) translate(82 281)"/>
  <use href="#srcTri" x="239" y="655" transform="scale(.70) translate(103 281)"/>
  <text x="270" y="663" class="txt label">Source</text>
  <use href="#tgtCircle" x="434" y="655" transform="scale(.70) translate(186 281)"/>
  <use href="#tgtTri" x="482" y="655" transform="scale(.70) translate(207 281)"/>
  <text x="514" y="663" class="txt label">Target</text>
  <use href="#noiseCircle" x="667" y="655" transform="scale(.70) translate(286 281)"/>
  <use href="#noiseTri" x="715" y="655" transform="scale(.70) translate(307 281)"/>
  <text x="748" y="663" class="txt label">Unreliable target</text>
  <circle cx="1009" cy="655" r="12" fill="none" stroke="#111111" stroke-width="3"/>
  <path d="M 1045 642 L 1057 665 L 1033 665 Z" fill="none" stroke="#111111" stroke-width="3"/>
  <text x="1077" y="663" class="txt label">circle / triangle = classes</text>
  <line x1="1370" y1="655" x2="1445" y2="655" stroke="#111111" stroke-width="5" stroke-dasharray="18 13"/>
  <text x="1464" y="663" class="txt label">decision boundary</text>
</svg>
