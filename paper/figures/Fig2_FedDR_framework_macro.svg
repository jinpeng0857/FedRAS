<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="72mm" viewBox="0 0 1800 720">
  <title>Macro framework of FedDR for federated continual test-time adaptation</title>
  <desc>Clean horizontal method schematic with federated source and target stream inputs, feature extraction, prediction, DLRS, FSLR, adapted model, evaluation, and continual feedback.</desc>
  <defs>
    <style>
      .txt{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.tiny{font-size:14px}
      .math{font-family:"Times New Roman",serif;font-size:23px;font-style:italic;fill:#111}
      .box{fill:#fff;stroke:#111;stroke-width:3}.soft{fill:#f7f7f7;stroke:#111;stroke-width:3}.group{fill:#fff;stroke:#111;stroke-width:3;stroke-dasharray:11 8}
      .black{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.red{fill:none;stroke:#d73027;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.blue{fill:none;stroke:#2c7fb8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.grad{fill:none;stroke:#111;stroke-width:3;stroke-dasharray:9 7;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="blackArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
    <marker id="blackBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#111"/></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d73027"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2c7fb8"/></marker>
    <marker id="blueBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#2c7fb8"/></marker>
  </defs>

  <rect width="1800" height="720" fill="#fff"/>
  <text x="900" y="44" text-anchor="middle" class="txt title">Overall framework of FedDR</text>

  <!-- Two left inputs -->
  <rect x="36" y="82" width="300" height="180" rx="20" class="group"/>
  <text x="186" y="116" text-anchor="middle" class="txt head">Federated Source Data</text>
  <circle cx="91" cy="169" r="18" fill="#d73027"/><circle cx="133" cy="143" r="18" fill="#d73027"/><circle cx="171" cy="184" r="18" fill="#d73027"/>
  <path d="M218 143 L238 181 L198 181 Z" fill="#d73027"/><path d="M273 126 L293 164 L253 164 Z" fill="#d73027"/><path d="M271 189 L291 227 L251 227 Z" fill="#d73027"/>
  <text x="186" y="244" text-anchor="middle" class="txt small">distributed labeled source domains</text>

  <rect x="36" y="402" width="300" height="160" rx="20" class="group"/>
  <text x="186" y="438" text-anchor="middle" class="txt head">Client Test Stream</text>
  <rect x="70" y="468" width="67" height="54" rx="10" class="soft"/><rect x="151" y="468" width="67" height="54" rx="10" class="soft"/><rect x="232" y="468" width="67" height="54" rx="10" class="soft"/>
  <text x="103" y="503" text-anchor="middle" class="math">Bₜ</text><text x="184" y="503" text-anchor="middle" class="txt body">···</text><text x="265" y="503" text-anchor="middle" class="math">Bₜ₊₁</text>
  <text x="186" y="548" text-anchor="middle" class="txt small">unlabeled target batches</text>

  <!-- Federated pretraining and anchor -->
  <rect x="389" y="101" width="217" height="80" rx="18" class="box"/>
  <text x="497" y="134" text-anchor="middle" class="txt head">Federated</text>
  <text x="497" y="163" text-anchor="middle" class="txt head">Pre-training</text>
  <path d="M336 172 L389 141" class="red" marker-end="url(#redArrow)"/>

  <rect x="389" y="218" width="217" height="82" rx="18" class="soft"/>
  <text x="497" y="250" text-anchor="middle" class="txt head">Anchor Model</text>
  <text x="497" y="282" text-anchor="middle" class="math">θ₀</text>
  <path d="M497 181 L497 218" class="red" marker-end="url(#redArrow)"/>

  <!-- Main client pipeline -->
  <rect x="389" y="388" width="217" height="100" rx="20" class="box"/>
  <text x="497" y="427" text-anchor="middle" class="txt head">Feature Extractor</text>
  <text x="497" y="460" text-anchor="middle" class="txt small">shared representation</text>
  <path d="M336 482 L389 438" class="blue" marker-end="url(#blueArrow)"/>
  <text x="357" y="459" class="math" fill="#2c7fb8">Bₜ</text>

  <rect x="665" y="388" width="180" height="100" rx="20" class="box"/>
  <text x="755" y="427" text-anchor="middle" class="txt head">Predict</text>
  <text x="755" y="461" text-anchor="middle" class="math">ŷₜ</text>
  <path d="M606 438 L665 438" class="blue" marker-end="url(#blueArrow)"/>

  <rect x="904" y="350" width="260" height="176" rx="22" class="group"/>
  <text x="1034" y="392" text-anchor="middle" class="txt head">DLRS</text>
  <text x="1034" y="427" text-anchor="middle" class="txt body">Sample Reliability</text>
  <text x="1034" y="455" text-anchor="middle" class="txt body">Weighting</text>
  <text x="1034" y="494" text-anchor="middle" class="txt small">suppress noisy influence</text>
  <path d="M845 438 L904 438" class="blue" marker-end="url(#blueArrow)"/>

  <rect x="1222" y="350" width="282" height="176" rx="22" class="group"/>
  <text x="1363" y="392" text-anchor="middle" class="txt head">FSLR</text>
  <text x="1363" y="427" text-anchor="middle" class="txt body">Drift-aware Sparse</text>
  <text x="1363" y="455" text-anchor="middle" class="txt body">Restoration</text>
  <text x="1363" y="494" text-anchor="middle" class="txt small">restore toward anchor</text>

  <!-- DLRS-FSLR mutual loop -->
  <path d="M1164 409 L1222 409" class="blue" marker-end="url(#blueArrow)"/>
  <path d="M1222 471 L1164 471" class="black" marker-end="url(#blackArrow)"/>
  <text x="1193" y="394" text-anchor="middle" class="txt tiny" fill="#2c7fb8">adapt</text>
  <text x="1193" y="497" text-anchor="middle" class="txt tiny">stabilize</text>

  <!-- Anchor delivery to client and restoration -->
  <path d="M606 259 C656 286,632 354,580 388" class="red" marker-end="url(#redArrow)"/>
  <text x="690" y="302" text-anchor="middle" class="txt small" fill="#d73027">anchor deployed to client</text>
  <path d="M606 244 C870 171,1230 174,1363 350" class="red" stroke-dasharray="12 9" marker-end="url(#redArrow)"/>
  <text x="1050" y="179" text-anchor="middle" class="txt small" fill="#d73027">anchor-guided restoration</text>

  <!-- Adapted model and evaluation -->
  <rect x="1559" y="354" width="190" height="90" rx="20" class="soft"/>
  <text x="1654" y="389" text-anchor="middle" class="txt head">Adapted Model</text>
  <text x="1654" y="421" text-anchor="middle" class="txt small">continual state</text>
  <path d="M1504 411 L1559 399" class="blue" marker-end="url(#blueArrow)"/>

  <rect x="1559" y="484" width="190" height="130" rx="20" class="box"/>
  <text x="1654" y="520" text-anchor="middle" class="txt head">Evaluation</text>
  <line x1="1588" y1="538" x2="1720" y2="538" stroke="#111" stroke-width="2"/>
  <text x="1654" y="566" text-anchor="middle" class="txt small">Clean domain</text>
  <text x="1654" y="592" text-anchor="middle" class="txt small">Historical revisit domain</text>
  <path d="M1654 444 L1654 484" class="black" marker-end="url(#blackArrow)"/>

  <!-- Gradient and next-batch loop -->
  <path d="M1034 526 C953 588,707 575,606 474" class="grad" marker-end="url(#blackArrow)"/>
  <text x="823" y="568" text-anchor="middle" class="txt small">gradient update</text>
  <path d="M1559 399 C1504 659,636 667,497 488" class="blue" marker-end="url(#blueArrow)"/>
  <rect x="831" y="626" width="363" height="27" fill="#fff"/>
  <text x="1013" y="647" text-anchor="middle" class="txt small" fill="#2c7fb8">continue with the next target batch</text>

  <!-- legend -->
  <rect x="239" y="668" width="1322" height="42" class="box"/>
  <line x1="281" y1="689" x2="344" y2="689" class="red" marker-end="url(#redArrow)"/><text x="364" y="696" class="txt body">federated source / anchor flow</text>
  <line x1="720" y1="689" x2="783" y2="689" class="blue" marker-end="url(#blueArrow)"/><text x="803" y="696" class="txt body">client target flow</text>
  <line x1="1107" y1="689" x2="1170" y2="689" class="grad" marker-end="url(#blackArrow)"/><text x="1190" y="696" class="txt body">gradient update</text>
  <rect x="1405" y="678" width="42" height="23" rx="7" class="box"/><text x="1461" y="696" class="txt body">module</text>
</svg>
